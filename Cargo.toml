[package]
name = "unau"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "Terminal code review that ends in a file an agent can act on"
license = "MIT"
repository = "https://github.com/KonstantinKai/unau"
homepage = "https://github.com/KonstantinKai/unau"
keywords = ["tui", "git", "diff", "code-review", "agent"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "assets/themes/*", "assets/notices/*", "THIRD_PARTY_NOTICES.md", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
jiff = "0.2.38"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
tempfile = "3"
toml = "1"
toml_edit = "0.25.17"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
