[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
hosting = "github"
installers = ["shell", "homebrew"]
# No Windows: running the agent in a pane needs tmux or Herdr, and unau has
# never been tried there. `dist init` adds it by default; leave it out.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
tap = "KonstantinKai/homebrew-tap"
publish-jobs = ["homebrew"]
# The bundled crates' and themes' licenses ask for their notices to go with
# every copy of the binary.
include = ["THIRD_PARTY_NOTICES.md"]
# Where `cargo install` puts it too, so either way of installing replaces the
# other instead of leaving two copies on PATH.
install-path = "CARGO_HOME"
# Upgrades go through brew, cargo or rerunning the installer.
install-updater = false
