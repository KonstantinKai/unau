# cargo-about: which dependency licenses revmark accepts. A dependency under
# any other license fails `cargo about generate` until it is looked at and
# added here on purpose.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# Only what ends up in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
